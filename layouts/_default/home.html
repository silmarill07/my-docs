{{ define "main" }}
  <div class="home-container">
    <section class="posts-section">
      <h2 class="posts-title">{{ i18n "recentPosts" }}</h2>

      <div class="posts-list">
        {{ range site.RegularPages | first 10 }}
          {{ partial "post-card.html" (dict "page" . "limit" 3) }}
        {{ end }}
      </div>
    </section>
  </div>
{{ end }}
