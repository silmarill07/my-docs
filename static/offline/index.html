<!doctype html>
<html lang="uk">
<head>

  <title>Немає з'єднання — My Docs</title>
  <style>
    :root { --accent: #BD5FFF; }

      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .wrap { text-align: center; max-width: 400px; }
    svg { opacity: 0.4; margin-bottom: 1.5rem; }
    h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.75rem; }

      display: inline-block;
      padding: 0.5rem 1.5rem;
      background: var(--accent);
      color: #fff;
      border-radius: 0.375rem;
      text-decoration: none;
      font-weight: 500;
    }
    a:hover { opacity: 0.85; }

</head>
